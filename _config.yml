# GitHub Pages Configuration

# Enable GitHub Pages
url: "https://miisol.net"
baseurl: ""

# Site settings
title: "Miisol Ltd - AI Technology Solutions"
description: "Cutting-edge AI technology solutions, consulting services, and agent discovery platforms for modern businesses."
author: "Miisol Ltd"

# Build settings
markdown: kramdown
highlighter: rouge

# Exclude files from processing
exclude:
  - README.md
  - .gitignore
  - .vscode/
  - node_modules/
  - package*.json

# Include files
include:
  - _redirects
  - .well-known

# Plugin settings
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# SEO settings
lang: en_GB
logo: /assets/images/logo.svg

# Social media
twitter:
  username: miisol_ltd
  card: summary_large_image
